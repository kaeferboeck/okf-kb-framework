name: validate-kb

on:
  push:
  pull_request:

jobs:
  frontmatter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frontmatter contract
        run: python3 tools/validate.py .
